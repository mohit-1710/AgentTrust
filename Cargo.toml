[workspace]
members = ["crates/agenttrust-domain", "contracts/agenttrust-core"]
default-members = ["crates/agenttrust-domain"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
borsh = { version = "=1.8.1", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
near-account-id = { version = "=3.0.0", features = ["serde", "borsh"] }
near-sdk = "=5.30.1"
agenttrust-domain = { path = "crates/agenttrust-domain" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
strip = true
