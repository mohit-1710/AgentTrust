[package]
name = "agenttrust-runtime-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT"

# A separate user-run fixture, never a production contract or default test.
[workspace]

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[dependencies]
near-sdk = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
strip = true
